<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MEKA Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#121212",
                        "container-dark": "#1E1E1E",
                        "input-dark": "#302839",
                        "text-light": "#E0E0E0",
                        "placeholder-dark": "#ab9db9"
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }
    </style>
</head>
<body class="bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 sm:px-8 md:px-16 lg:px-40 flex flex-1 justify-start py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1">
<div class="flex flex-wrap justify-between gap-3 p-4">
<p class="text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72">MEKA</p>
</div>
</div>
</div>
<div class="flex flex-1 items-center justify-center px-4">
<form id="login-form" class="bg-container-dark p-8 rounded-xl w-full max-w-md space-y-6">
<h2 class="text-white text-2xl font-bold text-center">Iniciar Sesión</h2>
<div class="flex max-w-[480px] flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light text-base font-medium leading-normal pb-2">Email</p>
<div class="flex w-full flex-1 items-stretch rounded-lg bg-input-dark focus-within:ring-2 focus-within:ring-primary">
<div class="text-placeholder-dark flex items-center justify-center pl-4">
<span class="material-symbols-outlined">mail</span>
</div>
<input id="email-input" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-input-dark h-14 placeholder:text-placeholder-dark p-4 text-base font-normal leading-normal" placeholder="Enter your email" type="email" required value=""/>
</div>
</label>
</div>
<div class="flex max-w-[480px] flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-lg bg-input-dark focus-within:ring-2 focus-within:ring-primary">
<div class="text-placeholder-dark flex items-center justify-center pl-4">
<span class="material-symbols-outlined">lock</span>
</div>
<input id="password-input" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-input-dark h-14 placeholder:text-placeholder-dark p-4 text-base font-normal leading-normal" placeholder="Enter your password" type="password" required value=""/>
<button type="button" aria-label="Toggle password visibility" class="text-placeholder-dark flex items-center justify-center pr-4">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
</div>
<p id="error-message" class="text-red-400 text-center text-sm" style="display: none;"></p>
<div class="flex pt-4 justify-center">
<button id="login-button" type="submit" class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">Login</span>
</button>
</div>
</form>
</div>
<div class="flex-grow"></div>
</div>
</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
